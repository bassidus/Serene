<!doctype html>
<!--
  The overlay at its defaults (SerenePerformance/Overlay.lua) over a blurred game scene
  (scene.png, cut from art/serene-curseforge.png by render.sh). Nimbus Sans Narrow has
  Arial Narrow's metrics. The numbers are made up, the same as in options.html.
-->
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#000}
#scene{position:relative;width:560px;height:320px;overflow:hidden}
#bg{position:absolute;inset:-12px;background:url(scene.png) center/cover;filter:blur(1.6px) brightness(.85)}
#ov{position:absolute;right:6px;bottom:6px;width:260px;background:rgba(0,0,0,.25)}
.t{position:absolute;white-space:nowrap;overflow:hidden;font-family:"Nimbus Sans Narrow","Arial Narrow",sans-serif;
   font-size:12px;line-height:16px;height:16px;
   text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000}
.r{text-align:right}
</style></head>
<body>
<div id="scene"><div id="bg"></div><div id="ov"></div></div>
<script>
// Overlay.lua defaults: width 260, auto height, cpuW 40, memW 50, font 12, top 5 by memory + pinned.
const PAD_X=6, PAD_Y=4, COL_GAP=6, W=260, cpuW=40, memW=50, rowH=Math.ceil(12*1.3);
const GOOD='#40ff40', OK='#ffd100', HIGH='#ff991a', BAD='#ff4040', HEAD='#ffd100', NAME='#d6d6d6';
const fps=v=>v>=50?GOOD:v>=25?OK:BAD, ms=v=>v<100?GOOD:v<250?OK:BAD, cpu=v=>v<5?GOOD:v<15?OK:BAD;
const memT=v=>v<100000?GOOD:v<250000?OK:BAD, memA=v=>v<2000?GOOD:v<5000?OK:v<10000?HIGH:BAD;
const pct=p=>p<=0?'0%':p<0.005?'&lt;0.01%':p>=10?p.toFixed(0)+'%':p>=1?p.toFixed(1)+'%':p.toFixed(2)+'%';
const mem=kb=>kb>=1000?(kb/1000).toFixed(2)+' MB':kb.toFixed(0)+' KB';
const c=(hex,s)=>`<span style="color:${hex}">${s}</span>`;

const rows=[['Serene Options',0.05,431],['Serene',0.01,247],['Serene Action Bar',0.12,201],
            ['Serene Performance',0.06,122],['Serene Unit Frames',0.08,106],['Serene Nameplates',0.31,93]];
const totalKB=1497, totalCpu=0.67;
const ov=document.getElementById('ov');
function text(x,y,w,html,right){const d=document.createElement('div');d.className='t'+(right?' r':'');
  Object.assign(d.style,{top:y+'px',width:w+'px'}); if(right) d.style.right=x+'px'; else d.style.left=x+'px';
  d.innerHTML=html; ov.appendChild(d);}
function row(y,name,cpuS,memS){
  text(PAD_X,y,W-2*PAD_X-memW-cpuW-COL_GAP,name);
  text(PAD_X+memW,y,cpuW,cpuS,true);
  text(PAD_X,y,memW,memS,true);
}
let y=PAD_Y;
row(y,c(HEAD,'AddOn'),c(HEAD,'CPU'),c(HEAD,'Memory')); y+=rowH;
for(const [n,p,kb] of rows){ row(y,c(NAME,n),c(cpu(p),pct(p)),c(memA(kb),mem(kb))); y+=rowH; }
const height=y+rowH+6+PAD_Y, ty=height-PAD_Y-rowH;
const line=document.createElement('div');
Object.assign(line.style,{position:'absolute',left:PAD_X+'px',right:PAD_X+'px',top:(ty-4)+'px',height:'1px',background:'rgba(255,255,255,.2)'});
ov.appendChild(line);
row(ty,c(fps(121),'121 fps')+'&nbsp;&nbsp;'+c(ms(41),'41 ms'),c(cpu(totalCpu),pct(totalCpu)),c(memT(totalKB),mem(totalKB)));
ov.style.height=height+'px';
</script>
</body></html>
